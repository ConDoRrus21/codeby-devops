global:
  scrape_interval: 15s

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']


  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']


  - job_name: 'diplom-app'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://diplom-app:8080/']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - target_label: __address__
        replacement: blackbox:9115



