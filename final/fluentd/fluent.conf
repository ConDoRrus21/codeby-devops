<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter diplom-app>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type regexp
    expression /^(?<time>\S+)\s+(?<level>\w+)\s+\d+\s+---\s+\[(?<thread>[^\]]+)\]\s+(?<logger>[^:]+):\s+(?<message>.*)$/
    time_key time
    time_type string
  </parse>
  emit_invalid_record_to_error false
</filter>

<match *.**>
  @type copy
  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    logstash_format true
    suppress_type_name true
    logstash_prefix fluentd
    logstash_dateformat %Y%m%d
    include_tag_key true
    type_name access_log
    tag_key @log_name
    flush_interval 1s
  </store>
  <store>
    @type stdout
  </store>
</match>
